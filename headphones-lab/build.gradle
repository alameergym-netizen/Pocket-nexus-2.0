plugins {
    id 'com.android.application' version '8.13.0'
}
android {
    namespace 'com.pocketnexus.headphones.lab'
    compileSdk 36
    defaultConfig {
        applicationId 'com.pocketnexus.headphones.lab'
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName '0.1-test'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    sourceSets {
        main.java.srcDir '../app/src/main/java/com/limelight/pocket/device/headphones'
        test.java.srcDir '../app/src/test/java/com/limelight/pocket/device/headphones'
    }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
