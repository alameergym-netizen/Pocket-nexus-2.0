name: Horizon reproducible build evidence
on:
  workflow_dispatch:
  pull_request:
    branches: [horizon-foundation]
    paths:
      - '.github/workflows/horizon-reproducibility.yml'
      - '.github/tests/compare_apks.py'
      - '.github/tests/compare_elf.py'
      - 'framegen/**'
      - 'app/build.gradle'
      - 'gradle/wrapper/gradle-wrapper.properties'
permissions:
  contents: read
concurrency:
  group: horizon-reproducibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Record build inputs and prepare SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reproducibility-evidence
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "ndk;27.0.12077973" "cmake;3.22.1"
          { git rev-parse HEAD; git submodule status --recursive; java -version; bash gradlew --version; } > reproducibility-evidence/toolchain.txt 2>&1
      - name: Two independent clean ARM64 dev builds at fixed version
        shell: bash
        run: |
          set -euo pipefail
          export NEXUS_VERSION_CODE=920000
          export GITHUB_SHA="$(git rev-parse HEAD)"
          # Clang honors SOURCE_DATE_EPOCH for __DATE__ and __TIME__.
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          printf "SOURCE_DATE_EPOCH=%s\n" "$SOURCE_DATE_EPOCH" >> reproducibility-evidence/toolchain.txt
          mkdir -p "$RUNNER_TEMP/nexus-rebuild"
          for name in first second; do
            bash gradlew --no-daemon clean
            rm -rf app/.cxx framegen/.cxx
            bash gradlew --no-daemon --no-build-cache --rerun-tasks -PpocketAbis=arm64-v8a :app:assembleNonRoot_gameDebug 2>&1 | tee "reproducibility-evidence/$name-build.log"
            cp app/build/outputs/apk/nonRoot_game/debug/*.apk "$RUNNER_TEMP/nexus-rebuild/$name.apk"
          done
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          for name in first second; do
            "$signer" verify --print-certs "$RUNNER_TEMP/nexus-rebuild/$name.apk" > "reproducibility-evidence/$name-signers.txt"
          done
          diff <(grep 'certificate SHA-256 digest:' reproducibility-evidence/first-signers.txt) <(grep 'certificate SHA-256 digest:' reproducibility-evidence/second-signers.txt)
          # Keep the exact comparison strict; produce ELF diagnostics before returning its status.
          status=0
          python3 .github/tests/compare_apks.py "$RUNNER_TEMP/nexus-rebuild/first.apk" "$RUNNER_TEMP/nexus-rebuild/second.apk" reproducibility-evidence/comparison.json || status=$?
          if [ "$status" -ne 0 ]; then
            elf_tool="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
            for name in first second; do
              unzip -p "$RUNNER_TEMP/nexus-rebuild/$name.apk" lib/arm64-v8a/libpocketfg.so > "$RUNNER_TEMP/nexus-rebuild/$name.so"
              "$elf_tool" --sections --notes --dynamic "$RUNNER_TEMP/nexus-rebuild/$name.so" > "reproducibility-evidence/$name-elf.txt"
            done
            python3 .github/tests/compare_elf.py "$RUNNER_TEMP/nexus-rebuild/first.so" "$RUNNER_TEMP/nexus-rebuild/second.so" reproducibility-evidence/elf-sections.json
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Horizon-reproducibility-evidence
          path: reproducibility-evidence/
          if-no-files-found: warn
          retention-days: 7
