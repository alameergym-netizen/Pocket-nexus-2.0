name: Horizon owner release policy
on:
  workflow_dispatch:
  pull_request:
    branches: [horizon-foundation]
    paths:
      - 'tools/Build-NexusRelease.ps1'
      - 'tools/NexusReleaseLedger.ps1'
      - 'tools/tests/Test-NexusReleaseLedger.ps1'
      - '.github/workflows/horizon-owner-policy.yml'
permissions:
  contents: read
jobs:
  owner-policy:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Parse local signing helper and test synthetic ledger
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/Build-NexusRelease.ps1').Path,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          & tools/tests/Test-NexusReleaseLedger.ps1
