name: Horizon package upgrade
on:
  workflow_dispatch:
  pull_request:
    branches: [horizon-foundation]
    paths:
      - 'app/build.gradle'
      - 'app/src/main/java/com/limelight/pocket/SettingsBackup.java'
      - '.github/workflows/horizon-upgrade.yml'
      - '.github/tests/horizon-upgrade.sh'
      - 'app/src/main/AndroidManifest.xml'
permissions:
  contents: read
concurrency:
  group: horizon-upgrade-${{ github.ref }}
  cancel-in-progress: true
jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build two successive test APKs using the same ephemeral debug signer
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "ndk;27.0.12077973" "cmake;3.22.1"
          mkdir -p upgrade-apks upgrade-results
          NEXUS_VERSION_CODE=900000 bash gradlew --no-daemon -PpocketAbis=x86_64 :app:assembleNonRoot_gameDebug
          cp app/build/outputs/apk/nonRoot_game/debug/*.apk upgrade-apks/before.apk
          NEXUS_VERSION_CODE=900001 bash gradlew --no-daemon -PpocketAbis=x86_64 :app:assembleNonRoot_gameDebug
          cp app/build/outputs/apk/nonRoot_game/debug/*.apk upgrade-apks/after.apk
          tools="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$tools" verify --print-certs upgrade-apks/before.apk > upgrade-results/before-signers.txt
          "$tools" verify --print-certs upgrade-apks/after.apk > upgrade-results/after-signers.txt
          diff <(grep 'certificate SHA-256 digest:' upgrade-results/before-signers.txt) <(grep 'certificate SHA-256 digest:' upgrade-results/after-signers.txt)
          test -s upgrade-results/before-signers.txt
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Test data-preserving upgrade on Android 13
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        timeout-minutes: 12
        with:
          api-level: 33
          arch: x86_64
          target: default
          ram-size: 2560M
          heap-size: 512M
          disk-size: 6000M
          emulator-options: -no-window -no-snapshot -gpu guest -feature -Vulkan -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 300
          script: bash .github/tests/horizon-upgrade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Horizon-upgrade-evidence
          path: upgrade-results/
          if-no-files-found: warn
          retention-days: 7
