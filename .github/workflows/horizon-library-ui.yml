name: Horizon Library workspace UI
on:
  workflow_dispatch:
  pull_request:
    branches: [horizon-foundation]
    paths:
      - 'app/src/main/java/com/limelight/pocket/library/**'
      - 'app/src/main/java/com/limelight/pocket/GamePageActivity.java'
      - 'app/src/main/java/com/limelight/pocket/ui/FocusGlow.java'
      - 'app/src/main/res/values/horizon_library_workspace.xml'
      - '.github/tests/library_workspace.py'
      - '.github/tests/control_workspace.py'
      - '.github/tests/home_workspace.py'
      - '.github/workflows/horizon-library-ui.yml'
permissions:
  contents: read
concurrency:
  group: horizon-library-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  library:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build emulator APK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "ndk;27.0.12077973" "cmake;3.22.1"
          bash gradlew --no-daemon -PpocketAbis=x86_64 :app:assembleNonRoot_gameDebug
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Verify workspace and capture screenshots
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        timeout-minutes: 15
        with:
          api-level: 33
          arch: x86_64
          target: default
          ram-size: 2560M
          heap-size: 512M
          disk-size: 6000M
          emulator-options: -no-window -no-snapshot -gpu guest -feature -Vulkan -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 300
          script: python3 -u .github/tests/library_workspace.py app/build/outputs/apk/nonRoot_game/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Horizon-Library-UI-evidence
          path: library-ui-results/
          if-no-files-found: warn
          retention-days: 7
