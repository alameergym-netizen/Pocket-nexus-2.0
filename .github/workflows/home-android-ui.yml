name: Home controls on Android
on:
  workflow_dispatch:
  pull_request:
    branches: [horizon-foundation]
    paths:
      - '.github/workflows/home-android-ui.yml'
      - '.github/tests/home_shortcuts.py'
      - '.github/tests/run_home_shortcuts.sh'
      - 'app/src/main/java/com/limelight/pocket/home/HomeActivity.java'
      - 'app/src/main/java/com/limelight/pocket/device/HorizonAudio.java'
      - 'app/src/main/java/com/limelight/pocket/global/ControlCenterActivity.java'
      - 'app/src/main/res/layout/activity_home.xml'
      - 'app/src/main/res/values/horizon_home_quick_actions.xml'
permissions:
  contents: read
concurrency:
  group: home-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  home:
    # The project's screenshot runs use 24.04; the emulator can exit on app launch on 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Prepare Android SDK and build the emulator APK
        shell: bash
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdk" --install "platforms;android-36" "ndk;27.0.12077973" "cmake;3.22.1"
          bash gradlew --no-daemon -PpocketAbis=x86_64 :app:assembleNonRoot_gameDebug
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Test the Home controls on Android 13
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        timeout-minutes: 12
        with:
          api-level: 33
          arch: x86_64
          target: default
          ram-size: 2560M
          heap-size: 512M
          disk-size: 6000M
          emulator-options: -no-window -no-snapshot -gpu guest -feature -Vulkan -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 300
          script: bash .github/tests/run_home_shortcuts.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Home-UI-results
          path: home-ui-results/
          if-no-files-found: warn
          retention-days: 7
