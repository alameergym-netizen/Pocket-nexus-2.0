name: Horizon Windows Companion CI
on:
  workflow_dispatch:
    inputs:
      ludusavi_runtime:
        description: Verify local save backups with the pinned Ludusavi CLI
        type: boolean
        default: false
  pull_request:
    branches: [horizon-foundation]
    paths:
      - 'pc-setup/**'
      - '.github/workflows/horizon-windows.yml'
  push:
    branches: [horizon-foundation]
    paths:
      - 'pc-setup/**'
      - '.github/workflows/horizon-windows.yml'
permissions:
  contents: read
jobs:
  windows-companion:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate synthetic game-library fixtures
        shell: pwsh
        run: python pc-setup/tests/make_fixtures.py
      - name: Compile and run Windows loopback self-test
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File pc-setup/PocketNexus-PC.ps1 -SelfTest -WifiPort 47119 2>&1 | Tee-Object -FilePath horizon-windows.log
          exit $LASTEXITCODE
      - name: Verify pinned TLS, revocation and Vibepollo metadata on loopback
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File pc-setup/tests/Test-SecureHost.ps1
          exit $LASTEXITCODE
      - name: Test Android upgrade preflight policy
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File pc-setup/Test-NexusUpgrade.ps1 -SelfTest
          exit $LASTEXITCODE
      - name: Verify GPU telemetry parsing and local driver capability detection
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File pc-setup/tests/Test-GpuTelemetry.ps1
          exit $LASTEXITCODE
      - name: Verify the bounded Playnite catalog and selected GUID actions
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File pc-setup/tests/Test-PlayniteCatalog.ps1
          exit $LASTEXITCODE
      - name: Verify the Windows Playnite library and capture its manual snapshot
        shell: powershell
        run: |
          & powershell.exe -STA -NoProfile -NonInteractive -ExecutionPolicy Bypass -File pc-setup/tests/Test-PlayniteLibraryView.ps1 -Screenshot dist/Nexus-Playnite-Library.png
          exit $LASTEXITCODE
      - name: Check the opt-in Windows save preview
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File pc-setup/tests/Test-SavePreview.ps1
          exit $LASTEXITCODE
      - name: Verify the Windows Save Vault window and capture its timeline
        shell: powershell
        run: |
          & powershell.exe -STA -NoProfile -NonInteractive -ExecutionPolicy Bypass -File pc-setup/tests/Test-SaveVaultView.ps1 -Screenshot dist/Nexus-Save-Vault.png
          exit $LASTEXITCODE
      - name: Verify recovery copies of Windows game snapshots
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File pc-setup/tests/Test-SaveRecoveryCopy.ps1
          exit $LASTEXITCODE
      - name: Verify local backups with Ludusavi 0.31.0 and synthetic saves
        if: ${{ inputs.ludusavi_runtime }}
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File pc-setup/tests/Test-LudusaviBackup.ps1
          exit $LASTEXITCODE
      - name: Verify real multi-game backups, failures and stopping through the Windows queue
        if: ${{ inputs.ludusavi_runtime }}
        shell: powershell
        run: |
          & powershell.exe -STA -NoProfile -NonInteractive -ExecutionPolicy Bypass -File pc-setup/tests/Test-SaveQueue.ps1 -Screenshot dist/Nexus-Save-Queue.png
          exit $LASTEXITCODE
      - name: Package development Windows helper
        shell: pwsh
        run: python pc-setup/tests/package_host.py dist/NexusHost-dev.zip
      - name: Verify, stage, install and remove the Windows development archive
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File pc-setup/tests/Test-WindowsPackage.ps1 -Archive dist/NexusHost-dev.zip
          exit $LASTEXITCODE
      - name: Upload tested development Windows helper
        uses: actions/upload-artifact@v4
        with:
          name: NexusHost-dev
          path: |
            dist/NexusHost-dev.zip
            dist/NexusHost-dev.zip.sha256
            pc-setup/Install-NexusHostDev.ps1
            pc-setup/Stage-NexusHostDev.ps1
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-Windows-diagnostics
          path: |
            horizon-windows.log
            dist/Nexus-Save-Vault.png
            dist/Nexus-Playnite-Library.png
            dist/Nexus-Save-Queue.png
          if-no-files-found: warn
          retention-days: 7
