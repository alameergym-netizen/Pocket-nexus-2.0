name: Horizon Foundation CI
on:
  workflow_dispatch:
  push:
    branches: [horizon-foundation]
  pull_request:
    branches: [horizon-foundation]
permissions:
  contents: read
concurrency:
  group: horizon-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -o pipefail
          # Avoid a successful sdkmanager operation failing because yes receives SIGPIPE.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ndk.dir=$ANDROID_HOME/ndk/27.0.12077973" > local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
      - name: Build development APK
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleNonRoot_gameDebug 2>&1 | tee horizon-build.log
      - name: Cache pinned Robolectric frameworks
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nexus-robolectric
          key: nexus-robolectric-v1-4.16-api33-api34
      - name: Prepare Robolectric frameworks
        shell: bash
        run: bash .github/tests/prepare_robolectric.sh "$RUNNER_TEMP/nexus-robolectric"
      - name: Run Pocket unit tests
        shell: bash
        run: |
          export NEXUS_ROBOLECTRIC_DIR="$RUNNER_TEMP/nexus-robolectric"
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 150s ./gradlew --no-daemon --stacktrace testNonRoot_gameDebugUnitTest --tests 'com.limelight.pocket.HorizonSettingsFocusTest' 2>&1 | tee horizon-tests.log
      - name: Upload diagnostics even if the build or tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-CI-diagnostics
          path: |
            horizon-build.log
            horizon-tests.log
            app/build/test-results/testNonRoot_gameDebugUnitTest/**
            app/build/reports/tests/testNonRoot_gameDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7
      - name: Upload tested development APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketNexus2-foundation-dev
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 7
