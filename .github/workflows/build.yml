name: Horizon Foundation CI
on:
  workflow_dispatch:
  push:
    branches: [horizon-foundation]
  pull_request:
    branches: [horizon-foundation]
permissions:
  contents: read
concurrency:
  group: horizon-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
          echo "ndk.dir=$ANDROID_HOME/ndk/27.0.12077973" > local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
      - name: Build development APK and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleNonRoot_gameDebug testNonRoot_gameDebugUnitTest --tests 'com.limelight.pocket.*'
      - uses: actions/upload-artifact@v4
        with:
          name: PocketNexus2-foundation-dev
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
