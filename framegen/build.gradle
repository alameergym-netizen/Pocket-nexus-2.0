// Lossless Scaling frame generation, built in: lsfg-vk (MIT) and LSFG-Android's native render
// loop (GPLv3, as this app), on the user's own Lossless.dll. Its native part needs Android 10+
// (AHardwareBuffer, NNAPI) and is only loaded there.
apply plugin: 'com.android.library'

android {
    namespace 'com.limelight.framegen'
    compileSdk = 36
    ndkVersion "27.0.12077973"

    defaultConfig {
        // The Java side is safe anywhere (it loads the native part only on Android 10+, see
        // FrameGen.load); the native part is built for Android 10 (ANDROID_PLATFORM below)
        minSdk 21
        ndk {
            abiFilters(*((project.findProperty('pocketAbis') ?: 'arm64-v8a').toString().split(',')))
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20", "-DNDEBUG", "-fvisibility=hidden", "-fvisibility-inlines-hidden",
                        "-ffunction-sections", "-fdata-sections", "-Wno-deprecated-declarations", "-Wno-unused-template"
                arguments "-DANDROID_STL=c++_static", "-DANDROID_PLATFORM=android-29",
                        "-DCMAKE_BUILD_TYPE=Release",
                        "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,--gc-sections,--icf=safe"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
