apply plugin: 'com.android.application'

android {
    ndkVersion "27.0.12077973"

    compileSdk = 36

    namespace 'com.limelight'

    defaultConfig {
        minSdk 21
        targetSdk 34

        // Pocket Nexus is English only (the controller keyboard still types Arabic)
        resourceConfigurations += ["en"]

        versionName "2.0.0-alpha.1"
        // Each CI build counts up (so the in-app updater's installs are always newer)
        versionCode = 20000 + (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
        // The build's commit, for the in-app updater to compare with the newest release
        buildConfigField "String", "GIT_SHA", "\"${(System.getenv('GITHUB_SHA') ?: 'dev').take(7)}\""

        // Artemis Pocket targets the Retroid Pocket 6 (Snapdragon 8 Gen 2), so only arm64 is built
        ndk {
            // -PpocketAbis=x86_64: the build's emulator screenshots (never shipped)
            abiFilters(*((project.findProperty('pocketAbis') ?: 'arm64-v8a').toString().split(',')))
        }

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'
    }

    flavorDimensions.add("root")

    buildFeatures {
        buildConfig = true
    }

    productFlavors {
        nonRoot_game {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                }
            }

            resValue "string",
                    "obtainium_app_url",
                    "https://github.com/alameergym-netizen/Pocket-nexus-2.0/releases"

            applicationId "com.pocketnexus.console"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
        checkReleaseBuilds false
        abortOnError false
    }

    // Release signing is independent of the legacy Pocket Nexus key.
    def horizonSigning = ['NEXUS_KEYSTORE', 'NEXUS_STORE_PASSWORD',
                          'NEXUS_KEY_ALIAS', 'NEXUS_KEY_PASSWORD']
    def hasHorizonSigning = horizonSigning.every { System.getenv(it) }
    if (!hasHorizonSigning && horizonSigning.any { System.getenv(it) }) {
        throw new GradleException('Incomplete Nexus release signing configuration')
    }
    signingConfigs {
        if (hasHorizonSigning) {
            horizon {
                storeFile rootProject.file(System.getenv('NEXUS_KEYSTORE'))
                storePassword System.getenv('NEXUS_STORE_PASSWORD')
                keyAlias System.getenv('NEXUS_KEY_ALIAS')
                keyPassword System.getenv('NEXUS_KEY_PASSWORD')
            }
        }
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    packaging {
        resources {
            pickFirsts.add('META-INF/versions/9/OSGI-INF/MANIFEST.MF')
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_label", "Pocket Nexus 2.0 (Dev)"
            resValue "string", "app_label_root", "Pocket Nexus 2.0 (Dev)"
            resValue "string", "app_label_game", "Pocket Nexus 2.0 (Dev)"
            signingConfig signingConfigs.debug

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            // To whomever is releasing/using an APK in release mode with
            // Moonlight's official application ID, please stop. I see every
            // single one of your crashes in my Play Console and it makes
            // Moonlight's reliability look worse and makes it more difficult
            // to distinguish real crashes from your crashy VR app. Seriously,
            // 44 of the *same* native crash in 72 hours and a few each of
            // several other crashes.
            //
            // This is technically not your fault. I would have hoped Google
            // would validate the signature of the APK before attributing
            // the crash to it. I asked their Play Store support about this
            // and they said they don't and don't have plans to, so that sucks.
            //
            // In any case, it's bad form to release an APK using someone
            // else's application ID. There is no legitimate reason, that
            // anyone would need to comment out the following line, except me
            // when I release an official signed Moonlight build. If you feel
            // like doing so would solve something, I can tell you it will not.
            // You can't upgrade an app while retaining data without having the
            // same signature as the official version. Nor can you post it on
            // the Play Store, since that application ID is already taken.
            // Reputable APK hosting websites similarly validate the signature
            // is consistent with the Play Store and won't allow an APK that
            // isn't signed the same as the original.
            //
            // I wish any and all people using Moonlight as the basis of other
            // cool projects the best of luck with their efforts. All I ask
            // is to please change the applicationId before you publish.
            //
            // TL;DR: Leave the following line alone!
            // Horizon uses its own application ID, independent of Pocket Nexus 1.0.
            resValue "string", "app_label", "Pocket Nexus 2.0"
            resValue "string", "app_label_root", "Pocket Nexus 2.0"
            resValue "string", "app_label_game", "Pocket Nexus 2.0"
            if (hasHorizonSigning) { signingConfig signingConfigs.horizon }

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
        // Robolectric's runtime Maven resolver is separate from Gradle's resolver.
        // Use the canonical Maven Central endpoint; retain all unit tests.
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
        }
    }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.81'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.81'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jmdns:jmdns:3.6.2'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'
    implementation 'com.google.code.gson:gson:2.13.1'
    // Console logos (SVG, downloaded at run time)
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.github.ByteHamster:SearchPreference:v2.5.1'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    // Artemis Pocket: game trailers (Steam streams them as HLS / DASH now)
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.5.1'
    // Pocket Nexus: the music player (plays in the background, media controls everywhere)
    implementation 'androidx.media3:media3-session:1.5.1'
    // Pocket Nexus: cloud gaming and sign-ins in a real browser tab (Google's sign-in, the mic)
    implementation 'androidx.browser:browser:1.8.0'
    // Better xCloud runs from the very start of xbox.com's pages (a document-start script)
    implementation 'androidx.webkit:webkit:1.11.0'
    // Lossless Scaling frame generation, built in (Android 10+, on the user's own Lossless.dll)
    implementation project(':framegen')

    // Unit test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'org.mockito:mockito-core:5.19.0'
}
